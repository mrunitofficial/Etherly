name: Pull Request Verification

on:
  pull_request:
    branches:
      - develop
      - preview
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify_branch_rules:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify PR branch constraints
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Target branch: $TARGET_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"
          
          if [ "$TARGET_BRANCH" = "main" ] && [ "$SOURCE_BRANCH" != "preview" ]; then
            echo "ERROR: Pull requests to 'main' must originate from the 'preview' branch. Got '$SOURCE_BRANCH'."
            exit 1
          fi
          
          if [ "$TARGET_BRANCH" = "preview" ] && [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "ERROR: Pull requests to 'preview' must originate from the 'develop' branch. Got '$SOURCE_BRANCH'."
            exit 1
          fi
          
          echo "PR branch constraint check passed."

      - name: Check version bump status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const targetBranch = context.payload.pull_request.base.ref;
            const sourceBranch = context.payload.pull_request.head.ref;
            
            // Read version from current checked out code (head/PR branch)
            let currentVersion = '';
            try {
              const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
              const match = pubspec.match(/^version:\s*(.+)$/m);
              if (match) currentVersion = match[1].trim();
            } catch (e) {
              console.log('Error reading current pubspec.yaml:', e);
            }
            
            // For merges from develop -> preview or preview -> main, same version is expected
            if (targetBranch === 'preview' || targetBranch === 'main') {
              try {
                const { data: baseFile } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'pubspec.yaml',
                  ref: targetBranch
                });
                const baseContent = Buffer.from(baseFile.content, 'base64').toString('utf8');
                const baseMatch = baseContent.match(/^version:\s*(.+)$/m);
                const baseVersion = baseMatch ? baseMatch[1].trim() : '';

                if (baseVersion && currentVersion && baseVersion !== currentVersion) {
                  const errorMsg = `**Version Check Error**: Expected the PR version (\`${currentVersion}\`) to match \`${targetBranch}\` (\`${baseVersion}\`) for a branch-to-branch merge.`;
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: errorMsg
                  });
                  core.setFailed(errorMsg);
                } else {
                  console.log(`PR from ${sourceBranch} to ${targetBranch}: matching version ${currentVersion} is expected.`);
                }
              } catch (e) {
                console.log('Could not check base branch version:', e);
              }
              return;
            }
            
            // For PRs into develop (feature branches), check if version was updated compared to base
            try {
              const { data: baseFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'pubspec.yaml',
                ref: targetBranch
              });
              const baseContent = Buffer.from(baseFile.content, 'base64').toString('utf8');
              const baseMatch = baseContent.match(/^version:\s*(.+)$/m);
              const baseVersion = baseMatch ? baseMatch[1].trim() : '';
              
              if (baseVersion && currentVersion && baseVersion === currentVersion) {
                const warningMsg = `**Version Check Warning**: The \`pubspec.yaml\` version (\`${currentVersion}\`) matches the version on \`${targetBranch}\`. If this PR contains user-facing changes, please consider updating the version number before merging!`;
                console.log(warningMsg);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: warningMsg
                });
              } else {
                console.log(`Version bump detected: ${baseVersion} -> ${currentVersion}`);
              }
            } catch (e) {
              console.log('Could not check base branch version:', e);
            }

      - name: Auto-generate PR Title
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const targetBranch = context.payload.pull_request.base.ref;
            const sourceBranch = context.payload.pull_request.head.ref;
            
            let version = '';
            try {
              const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
              const match = pubspec.match(/^version:\s*(.+)$/m);
              if (match) {
                version = match[1].trim();
              }
            } catch (e) {
              console.log('Could not read pubspec.yaml:', e);
            }
            
            let autoTitle = '';
            if (targetBranch === 'main') {
              autoTitle = `Release: merge preview (v${version}) to main`;
            } else if (targetBranch === 'preview') {
              autoTitle = `Preview: merge develop (v${version}) to preview`;
            } else {
              autoTitle = `Feat: merge ${sourceBranch} to ${targetBranch}`;
            }
            
            console.log(`Updating PR title to: ${autoTitle}`);
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title: autoTitle
            });

  analyze:
    needs: verify_branch_rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle templates (Android)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  verification_complete:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Log Completion
        run: echo "All PR verification checks completed successfully."
